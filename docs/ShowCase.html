<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LivePic Showcase</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
      }
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
      }
      .container {
        --gap: 1rem;
        --pic-size: 160px;
        --container-size: calc(var(--pic-size) * 3 + var(--gap) * 2);
        width: 100%;
        max-width: var(--container-size);
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script type="module" src="https://unpkg.com/livepic@latest"></script>
  </head>
  <body>
    <div class="container">
      <live-pic
        sprite="./assets/AvatarSprite.webp"
        placeholder="./assets/LoadingPlaceholder.jpeg"
        gridSize="25"
      ></live-pic>
      <live-pic
        sprite="./assets/AvatarSprite.webp"
        placeholder="./assets/LoadingPlaceholder.jpeg"
        gridSize="25"
      ></live-pic>

      ></live-pic>
      <live-pic
        sprite="./assets/AvatarSprite.webp"

      ></live-pic>
    </div>
  </body>
</html>
